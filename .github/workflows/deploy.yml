name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  TESTED_ADMIN_SHA: 528caf25e1add6c03e4f5f990ddecea939abe2cb
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fetch admin fixtures
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: umar200000/momiq_admin
          ref: ${{ env.TESTED_ADMIN_SHA }}
          path: admin-fixture
      - run: python -m pip install -r requirements.txt
      - name: Audit the pinned runtime before deployment
        run: |
          python -m venv "${RUNNER_TEMP}/momiq-pip-audit"
          "${RUNNER_TEMP}/momiq-pip-audit/bin/python" -m pip install pip-audit==2.10.1
          "${RUNNER_TEMP}/momiq-pip-audit/bin/python" -m pip_audit --disable-pip --require-hashes -r requirements.lock
      - run: python -m unittest -q
        env:
          MOMIQ_ADMIN_DIR: ${{ github.workspace }}/admin-fixture
      - run: bash -n deploy/momiq-deploy deploy/momiq-deploy-entry

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch admin files tested with this release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: umar200000/momiq_admin
          ref: ${{ env.TESTED_ADMIN_SHA }}
          path: admin-fixture
      - name: Verify active admin files before deploying backend
        run: python deploy/verify_release.py --admin-only --admin-dir admin-fixture
      - name: Deploy tested commit
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/momiq
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/momiq' EXIT
          ssh -i ~/.ssh/momiq -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 momiq-deploy@95.182.119.218 "$COMMIT_SHA"
      - name: Verify HTTPS
        run: python deploy/verify_release.py "${{ github.sha }}" --admin-dir admin-fixture
