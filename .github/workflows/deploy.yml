name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fetch admin fixtures
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: umar200000/momiq_admin
          path: admin-fixture
      - run: python -m unittest -q
        env:
          MOMIQ_ADMIN_DIR: ${{ github.workspace }}/admin-fixture
      - run: bash -n deploy/momiq-deploy deploy/momiq-deploy-entry

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Deploy tested commit
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/momiq
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/momiq' EXIT
          ssh -i ~/.ssh/momiq -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 momiq-deploy@95.182.119.218 "$COMMIT_SHA"
      - name: Verify HTTPS
        run: curl --fail --retry 5 --retry-delay 3 https://api.momiq.net/api/health
