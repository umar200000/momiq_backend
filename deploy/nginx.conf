limit_req_zone $binary_remote_addr zone=momiq_login:10m rate=5r/m;
log_format momiq_private '$time_iso8601 $status $body_bytes_sent $request_time';
server {
    listen 80;
    server_name momiq.net;
    access_log /var/log/nginx/momiq-access.log momiq_private;
    location / { return 302 https://admin.momiq.net; }
}
server {
    listen 80;
    server_name api.momiq.net;
    access_log /var/log/nginx/momiq-access.log momiq_private;
    client_max_body_size 32m;
    location ^~ /api/admin/ { return 404; }
    location = /api/auth/login {
        limit_req zone=momiq_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/momiq-proxy.conf;
    }
    location /api/ { include /etc/nginx/snippets/momiq-proxy.conf; }
    location / { return 404; }
}
server {
    listen 80;
    server_name admin.momiq.net;
    access_log /var/log/nginx/momiq-access.log momiq_private;
    client_max_body_size 32m;
    location = /api/admin/login {
        limit_req zone=momiq_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/momiq-proxy.conf;
    }
    location /api/admin/ { include /etc/nginx/snippets/momiq-proxy.conf; }
    location /api/ { return 404; }
    location / { include /etc/nginx/snippets/momiq-proxy.conf; }
}
